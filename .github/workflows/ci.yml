name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python test dependencies
        run: >-
          python -m pip install pytest==9.0.3 cryptography==49.0.0
          jsonschema==4.26.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Check release source archive for local path leaks
        run: python scripts/check_release_content.py --git-ref HEAD

      - name: Run full Python suite
        run: python -m pytest -q

      - name: Run frontend contracts
        run: |
          node tests/api_frontend_contract.mjs
          node tests/frontend_core_contract.mjs
          node tests/harvest_frontend_contract.mjs

      - name: Build frontend
        run: npm run build

      - name: Validate committed claim fixture
        run: >-
          python scripts/validate_report_claims.py
          --root tests/fixtures/report_claims
          tests/fixtures/report_claims/reports/manifests/fixture.claims.json

      - name: Validate committed claim fixture in formal mode
        run: >-
          python scripts/validate_report_claims.py
          --formal
          --root tests/fixtures/report_claims
          tests/fixtures/report_claims/reports/manifests/fixture.claims.json

      - name: Check release, version, and documentation consistency
        run: |
          python tests/test_release_readiness.py
          python tests/test_release_packaging.py
          python tests/test_version_consistency.py
          python tests/test_documentation_consistency.py
