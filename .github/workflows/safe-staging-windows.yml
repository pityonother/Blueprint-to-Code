name: Safe staging Windows

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/safe-staging-windows.yml"
      - "scripts/update_ark_kb_vnext.py"
      - "scripts/blueprint_translator/kb_vnext/pointer_cas.py"
      - "scripts/blueprint_translator/kb_vnext/blueprint_ingest.py"
      - "scripts/blueprint_translator/kb_vnext/incremental_delta.py"
      - "scripts/blueprint_translator/kb_vnext/safe_staging.py"
      - "scripts/blueprint_translator/kb_vnext/update_baseline.py"
      - "tests/test_kb_pointer_cas.py"
      - "tests/test_kb_additive_quarantine.py"
      - "tests/test_kb_safe_staging.py"
      - "tests/test_kb_update_baseline.py"
      - "tests/test_update_ark_kb_vnext.py"

permissions:
  contents: read

concurrency:
  group: safe-staging-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install focused test dependencies
        run: >-
          python -m pip install pytest==9.0.3 cryptography==49.0.0
          jsonschema==4.26.0

      - name: Run reparse-safe staging tests
        run: >-
          python -m pytest -q
          tests/test_kb_additive_quarantine.py
          tests/test_kb_safe_staging.py
          tests/test_kb_update_baseline.py::test_stage_rejects_snapshot_without_sealed_authority_contract
          tests/test_update_ark_kb_vnext.py::test_default_staging_uses_locked_update_baseline
          tests/test_update_ark_kb_vnext.py::test_default_runner_rescans_sources_after_staging
          tests/test_update_ark_kb_vnext.py::test_default_additive_pipeline_returns_real_fact_receipt_and_blocks_gaps
